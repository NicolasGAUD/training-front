<header class="header">
  <h1>Training Shop</h1>
  <nav aria-label="Navigation principale">
    <a
      routerLink="/"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      >Accueil</a
    >
    <a routerLink="/account" routerLinkActive="active" ariaCurrentWhenActive="page">Mon compte</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/products/new" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Ajouter un produit</a
      >
    }
    @if (!auth.isLoggedIn()) {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Se connecter</a
      >
    }
  </nav>
  <p>Le catalogue d'entraînement</p>
  <p>🛒 {{ count() }} article(s) · {{ total().toFixed(2) }} €</p>
  <p>{{ shipping() }}</p>
  <button type="button" (click)="onClear()">Vider le panier</button>
</header>
