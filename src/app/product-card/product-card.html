<article class="product-card">
  <img [ngSrc]="product().thumbnail" [alt]="product().title" width="156" height="156" />
  <h3>{{ product().title }}</h3>
  <p>{{ product().price }} €</p>
  <p>{{ product().availabilityStatus }}</p>
  <button
    type="button"
    (click)="addToCart()"
    [disabled]="product().stock === 0"
    [attr.aria-label]="'Ajouter ' + product().title + ' au panier'"
  >
    Ajouter au panier
  </button>
</article>
